services:
  budget-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget-service
    ports:
      - '3003:3003'
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://fepa:fepa123@fepa-postgres:5432/fepa_budget
      - RABBITMQ_URL=amqp://fepa:fepa123@fepa-rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:-fepa-key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    restart: on-failure
    networks:
      - fepa-network
    # volumes:
    #   - .:/app
    #   - /app/node_modules

networks:
  fepa-network:
    name: fepa-network
    external: true
